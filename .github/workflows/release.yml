# 윈도우(.exe)·맥(.dmg)·리눅스(.tar.gz)를 GitHub 서버에서 빌드해서 릴리스에 올립니다.
#  - v로 시작하는 태그를 올리면(예: v2.0.0) → 빌드 + 자체검사 + 릴리스 생성
#  - Actions 탭에서 직접 실행(workflow_dispatch) → 빌드 결과만 내려받기용으로 저장
name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PILLOW_VERSION: "12.3.0"
  NUMPY_VERSION: "2.5.3"
  OPENPYXL_VERSION: "3.1.5"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치 (검증한 버전으로 고정)
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller "pillow==$env:PILLOW_VERSION" "numpy==$env:NUMPY_VERSION" "openpyxl==$env:OPENPYXL_VERSION"

      - name: 자체검사 (소스)
        run: python bus_sign_maker.py --selftest

      - name: 아이콘 만들기
        run: python -c "from PIL import Image; Image.open('icon.png').save('icon.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: exe 빌드
        run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name BusSignMaker --icon icon.ico
          --add-data "fonts:fonts"
          --hidden-import numpy --hidden-import PIL._tkinter_finder --hidden-import PIL.ImageTk
          bus_sign_maker.py

      - name: 자체검사 (완성된 exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\BusSignMaker.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "exe 자체검사 실패 (종료코드 $($p.ExitCode))"; exit 1 }
          Write-Host "exe 자체검사 통과"

      - name: 이름 정리
        shell: pwsh
        run: Copy-Item dist\BusSignMaker.exe BusSignMaker-Windows.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: BusSignMaker-Windows.exe

  macos:
    runs-on: macos-latest   # 애플 실리콘(M1~M4)용
    steps:
      - uses: actions/checkout@v4

      - name: python.org 파이썬 3.12 설치 (tkinter Tk 8.6 포함)
        run: |
          curl -sSLo py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target / > /dev/null
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3 -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: DMG 빌드 (자체검사 2번 포함)
        env:
          PY_OVERRIDE: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3
        run: bash build_dmg.command

      - name: 이름 정리
        run: cp BusSignMaker.dmg BusSignMaker-macOS-AppleSilicon.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: BusSignMaker-macOS-AppleSilicon.dmg

  linux:
    runs-on: ubuntu-22.04   # 오래된 배포판에서도 돌도록 glibc 2.35 기준으로 빌드
    steps:
      - uses: actions/checkout@v4

      - name: Tk 라이브러리 설치
        run: sudo apt-get update -q && sudo apt-get install -y -q tk8.6 libtk8.6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 라이브러리 설치 (검증한 버전으로 고정)
        run: |
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
          python -m pip install --upgrade pip
          pip install pyinstaller "pillow==$PILLOW_VERSION" "numpy==$NUMPY_VERSION" "openpyxl==$OPENPYXL_VERSION"

      - name: 자체검사 (소스)
        run: python bus_sign_maker.py --selftest

      - name: 실행 파일 빌드
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name BusSignMaker
          --add-data "fonts:fonts"
          --hidden-import numpy --hidden-import PIL._tkinter_finder --hidden-import PIL.ImageTk
          bus_sign_maker.py

      - name: 자체검사 (완성된 실행 파일)
        run: ./dist/BusSignMaker --selftest

      - name: 묶기 (실행 권한 유지를 위해 tar.gz)
        run: |
          mkdir BusSignMaker-Linux-x86_64
          cp dist/BusSignMaker BusSignMaker-Linux-x86_64/
          cp README.md LICENSE BusSignMaker-Linux-x86_64/
          tar czf BusSignMaker-Linux-x86_64.tar.gz BusSignMaker-Linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: BusSignMaker-Linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: 엑셀 샘플을 영문 이름으로 (첨부 파일 이름의 한글이 깨지지 않게)
        run: |
          cp "samples/노선샘플.xlsx" out/BusSignMaker-sample-routes.xlsx
          cp "samples/부산노선_샘플.xlsx" out/BusSignMaker-busan-routes.xlsx
          cp "samples/서울노선_샘플.xlsx" out/BusSignMaker-seoul-routes.xlsx

      - name: 릴리스 만들기
        uses: softprops/action-gh-release@v2
        with:
          name: 노선이미지 생성기 ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: |
            out/windows/BusSignMaker-Windows.exe
            out/macos/BusSignMaker-macOS-AppleSilicon.dmg
            out/linux/BusSignMaker-Linux-x86_64.tar.gz
            out/BusSignMaker-sample-routes.xlsx
            out/BusSignMaker-busan-routes.xlsx
            out/BusSignMaker-seoul-routes.xlsx
